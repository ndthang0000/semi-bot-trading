[app]
symbol = "XAUUSD"

[data]
directory = "data"
database = "var/trading.sqlite3"

[structure.swing]
detector = "swing_v1"
tolerance = 0.0

[structure.swing.timeframes]
H1 = { window = 4 }
M15 = { window = 4 }

[structure.breaks]
detector = "break_v1"
close_break_buffer = 0.0

[context.bias]
detector = "bias_v2"
timeframe = "H1"
recent_swings = 6
recent_breaks = 3

[context.macro_trend]
detector = "macro_trend_v1"
timeframe = "H1"
# 30 days × 24 H1 candles. Momentum = close now vs close lookback_candles ago.
lookback_candles = 720
# |momentum| in ATR units must exceed this to call up/down; otherwise flat.
# 2.0 ATR over 720 H1 candles (~30 days) filters out sideways drift.
flat_threshold_atr = 2
atr_period = 14

[context.regime]
detector = "regime_v1"
timeframe = "H1"
atr_period = 14
lookback = 50
atr_high_percentile = 0.80
atr_low_percentile = 0.20
expansion_atr_ratio = 1.20
contraction_atr_ratio = 0.80
trend_break_ratio = 0.60
trend_min_bos = 2
range_efficiency_max = 0.25

[zones.support_resistance]
detector = "sr_v2"
tolerance_pct = 0.0005
min_zone_width = 1.0
atr_width_multiplier = 0.25
min_touches = 2
lookback_swings = 1500   # ~18 tháng H1, ~6 tháng M15
max_zones = 100

[zones.lifecycle]
close_break_buffer = 0.0
close_break_buffer_atr_multiplier = 0.15
recent_touch_lookback_candles = 80
age_decay_per_100_candles = 0.06
freshness_bonus = 0.12
invalidation_weight_multiplier = 0.15
false_break_refine_enabled = true
false_break_refine_max_width_atr_multiplier = 0.8
false_break_parent_weight_multiplier = 0.35

[zones.reaction]
reaction_window_candles = 5
min_reaction_atr = 0.8
strong_reaction_atr = 1.5
recent_reaction_count = 3
follow_through_close_required = true

[zones.decay]
max_healthy_touches = 3
weak_touch_penalty = 0.08
too_many_touches_penalty = 0.06
linger_penalty = 0.10

[zones.smc]
max_candles = 5000
lookback_swings = 1500   # ~18 tháng H1, ~6 tháng M15
fvg_middle_candle_atr_multiplier = 2.0
fvg_gap_atr_ratio = 0.25
fvg_min_width_atr_ratio = 1.0
fvg_max_width_atr_ratio = 2
fvg_third_candle_follow_through_required = true
fvg_third_candle_min_body_ratio = 0.20
fvg_h1_max_active_days = 2.0
fvg_h1_decay_start_days = 0.75
fvg_m15_max_active_days = 1.0
fvg_m15_decay_start_days = 0.5
ob_displacement_atr_multiplier = 1.5
ob_min_body_ratio = 0.60
ob_min_width_atr_ratio = 0.05
ob_max_width_atr_ratio = 1.0
ob_require_structure_break = true
ob_merge_overlap_ratio = 0.60
ob_h1_max_active_days = 3.0
ob_h1_decay_start_days = 1.0
ob_m15_max_active_days = 2.0
ob_m15_decay_start_days = 1.0
max_fvg_zones = 80
max_order_block_zones = 60
max_liquidity_zones = 80
max_consolidation_zones = 30

[price_action]
detector = "price_action_v1"
timeframe = "M15"
atr_period = 14
displacement_atr_multiplier = 1.5
displacement_body_ratio = 0.60
pinbar_wick_body_ratio = 2.0
pinbar_min_wick_ratio = 0.55
engulfing_min_body_ratio = 0.45
marubozu_min_body_ratio = 0.75
star_large_body_ratio = 0.45
star_small_body_ratio = 0.35

[strategy]
timeframe = "M15"
atr_period = 14
approach_atr_multiplier = 0.5
breakout_buffer_atr_multiplier = 0.15
waiting_candles = 4
min_risk_reward = 2.0
max_eligible = 3
max_waiting = 5

[strategy.playbooks.zone_reaction_v2]
enabled = true
allowed_reactions = ["reject", "internal_reject"]
fakeout_max_atr = 0.5
reject_recovery_min_avg_body_ratio = 2.0
reject_avg_body_period = 20
reject_h1_touch_required = false
reject_h1_touch_lookback_bars = 3
slow_min_bars = 3
slow_max_bars = 8
slow_body_max_ratio = 0.8
# "zone": classic stop beyond the whole zone. If zone-stop exceeds max_stop_distance,
# the bot falls back toward tighter stop models instead of blocking the setup.
# "reaction_wick" always uses the wick unless it is still too wide.
reject_stop_mode = "zone"
rr_minimum = 2.0
stop_buffer_atr = 0.2
min_stop_price = 4.0
min_stop_atr = 1.5
max_stop_distance = 25.0
# If both full-zone and reaction-wick stops are too wide, use 1.2x H1 context
# ATR as the final stop layer instead of blocking. max_stop_distance is a
# fallback trigger threshold, not a hard reject cap.
reject_wide_stop_fallback = "atr"
reject_atr_stop = 1.2
# If a reject candle closes more than 2 ATR from the zone edge, do not chase
# market. Place a retest limit at the zone edge instead.
impulse_limit_extension_atr = 2.0
impulse_limit_expiry_bars = 8
require_trigger_for_fakeout = true
fakeout_max_reaction_depth_atr = 1.5
internal_reject_enabled = true
internal_reject_requires_structure = false
# SR internal reject can trigger from strong PA alone; human SR zones often encode
# the structure thesis already, while bot zones still need PA/RR/stop quality.
internal_reject_sr_requires_structure = false
internal_reject_requires_price_action = true
internal_reject_watch_after_fvg_fill_bars = 8
# Internal reject shares reject_recovery_min_avg_body_ratio and the exact same
# preceding 20-candle body baseline as classic reject.
# SR and FVG now share one depth definition: percentage filled through the zone.
# This avoids an ATR-based SR threshold changing meaning when zone width changes.
internal_reject_min_fill_ratio = 0.4
internal_reject_deep_fvg_fill_ratio = 0.8
# Internal reject invalidates beyond its reaction wick, even when that stop
# remains inside the wider parent zone.
internal_reject_stop_buffer_atr = 0.4
allow_neutral_range_trade = true
block_news_or_risk_off = true
# Block shorts when macro trend is up and longs when macro trend is down.
macro_gate_enabled = true
# Bot FVG candidate is allowed when H1 bias OR macro trend supports its direction.
# Set to false to research FVG zones without this combined context gate.
fvg_macro_gate_enabled = true
# Cap accepted trades per FVG zone. 0 disables the cap.
fvg_max_trades_per_zone = 2
confluence_score_bonus = 0.08

[strategy.playbooks.sr_breakout_v1]
enabled = true
# breakout_close (market entry at the breakout candle) backtested -5.24R/45 trades.
# Remove it from this list to go retest-only.
allowed_entries = ["breakout_close", "retest_breakout"]
# Bot SR breakout is off by default; human can opt a zone into breakout via trade_modes.
allow_bot_sr_breakout = true
breakout_buffer_atr = 0.15
market_entry_max_distance_atr = 0.5
retest_max_bars = 8
# Breakout candle body must be at least this many H1 ATR, otherwise wait for retest.
min_body_atr = 0.5
# "atr": flat sl_atr stop. "zone_edge": structural stop behind the broken edge.
sl_mode = "zone_edge"
sl_zone_buffer_atr = 0.2
sl_min_atr = 0.6
sl_atr = 1.6
rr = 2.0
# Wide zone-edge stops fall back to ATR stop; this is not a hard block cap.
max_stop_distance = 40.0

[strategy.playbooks.liquidity_sweep_reclaim_v1]
enabled = true
# A liquidity zone is inert until metadata.trade_modes explicitly contains
# "liquidity_sweep". Existing liquidity zones therefore remain safe after deploy.
timeout_minutes = 15
max_sweep_atr = 1.0
sl_buffer_atr = 0.2

[strategy.playbooks.h1_impulse_retest_v1]
# Human-approved limit execution reuses the guarded Manual AI worker lifecycle.
# Automatic generation and backtest execution remain out of scope.
atr_period = 14
stop_buffer_atr = 0.1
min_stop_atr = 0.5
max_stop_atr = 1.2
min_body_atr = 0.8
min_range_atr = 0.9
max_range_atr = 2.5
min_body_range_ratio = 0.6
min_close_location = 0.75
max_close_side_wick_ratio = 0.2
# Wave Safe captures a conservative fraction of the historical same-direction
# median wave instead of targeting the whole baseline move.
wave_safe_fraction = 0.625
min_wave_samples = 3
expiry_medium_body_atr = 1.2
expiry_large_body_atr = 1.6
expiry_hours_small = 6
expiry_hours_medium = 12
expiry_hours_large = 18
# Order TTL is trader-selectable at approval time. A signal itself cannot be
# renewed indefinitely even when the original pending order never filled.
min_order_ttl_hours = 1
max_order_ttl_hours = 48
max_signal_age_hours = 48

[backtest]
auto_accept = true
spread = 0.30
slippage = 0.10
max_hold_candles = 96
warmup_candles = 80
zone_snapshot_candles = 600
zone_loss_cooldown_candles = 12
