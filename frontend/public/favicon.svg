<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a"/>

  <!-- Antenna base -->
  <rect x="29" y="6" width="6" height="3" rx="1.5" fill="#f59e0b"/>
  <!-- Antenna stick -->
  <rect x="31" y="3" width="2" height="5" fill="#f59e0b"/>
  <!-- Antenna ball -->
  <circle cx="32" cy="3" r="2.5" fill="#fbbf24"/>

  <!-- Robot head -->
  <rect x="14" y="18" width="36" height="28" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

  <!-- Left eye -->
  <rect x="18" y="24" width="10" height="8" rx="2" fill="#0f172a"/>
  <rect x="20" y="26" width="6" height="4" rx="1" fill="#fbbf24"/>
  <!-- Left eye glow -->
  <circle cx="23" cy="28" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Right eye -->
  <rect x="36" y="24" width="10" height="8" rx="2" fill="#0f172a"/>
  <rect x="38" y="26" width="6" height="4" rx="1" fill="#fbbf24"/>
  <!-- Right eye glow -->
  <circle cx="41" cy="28" r="1.5" fill="#fff" opacity="0.8"/>

  <!-- Mouth — smile made of small squares (pixel style) -->
  <rect x="20" y="36" width="4" height="3" rx="1" fill="#34d399"/>
  <rect x="25" y="38" width="4" height="3" rx="1" fill="#34d399"/>
  <rect x="30" y="39" width="4" height="3" rx="1" fill="#34d399"/>
  <rect x="35" y="38" width="4" height="3" rx="1" fill="#34d399"/>
  <rect x="40" y="36" width="4" height="3" rx="1" fill="#34d399"/>

  <!-- Tiny chart bars at bottom -->
  <rect x="18" y="50" width="4" height="6" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="24" y="47" width="4" height="9" rx="1" fill="#f59e0b" opacity="0.9"/>
  <rect x="30" y="52" width="4" height="4" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="36" y="44" width="4" height="12" rx="1" fill="#fbbf24"/>
  <rect x="42" y="49" width="4" height="7" rx="1" fill="#f59e0b" opacity="0.8"/>
</svg>
